name: Cập nhật tin

on:
  schedule:
    - cron: "*/30 * * * *"   # mỗi 30 phút (GitHub có thể trễ vài phút)
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tải tin và tạo trang
        run: python tong_hop_tin.py --no-open --out site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
